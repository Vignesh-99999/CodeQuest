    <style>
        body {
    background: #000e29;
}

.notification-box {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    max-height: 100vh;
    overflow-y: auto;
    z-index: 9999;
}

.alert {
    position: relative;
    padding: 1rem;
    margin: 0.5rem 0; /* Ensure some space between notifications */
    border: 1px solid transparent;
    border-radius: .25rem;
    cursor: pointer;
}

.alert .close {
    position: absolute;
    top: .75rem;
    right: 1rem;
    color: inherit;
    cursor: pointer;
}

.alert-warning {
    border-color: rgba(241, 142, 6, 0.81);
    background-color: rgba(220, 128, 1, 0.16);
    box-shadow: 0px 0px 2px #ffb103;
    color: #ffb103;
    text-shadow: 2px 1px #00040a;
    transition: 0.5s;
}

.alert-warning:hover {
    background-color: rgba(220, 128, 1, 0.33);
}

.warning {
    font-size: 18px;
    color: #ffb40b;
    text-shadow: none;
}

.fa-times {
    -webkit-animation: blink-1 2s infinite both;
    animation: blink-1 2s infinite both;
}

@-webkit-keyframes blink-1 {
    0%, 50%, 100% {
        opacity: 1;
    }
    25%, 75% {
        opacity: 0;
    }
}

@keyframes blink-1 {
    0%, 50%, 100% {
        opacity: 1;
    }
    25%, 75% {
        opacity: 0;
    }
}

    </style>
    <!-- Custom styles -->
    <style>
        .main-nav {

        }
        .night-mode .nav a {
            color: #e0e0e0;
        }
        .night-mode .nav a.active {

        }
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            border-radius: 50%;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
        }
        input:checked + .slider {
            background-color: #4CAF50;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        .sun, .moon {
            display: inline-block;
            vertical-align: middle;
            width: 24px;
            height: 24px;
            fill: #ffd43b;
        }
    </style>
</head>

    <div class="notification-box" id="notification-box">
        <!-- Notifications will be dynamically inserted here by JavaScript -->
    </div>
    <script>
        function fetchNotifications() {
        $.ajax({
            url: "{% url 'get_notifications' student=8 %}", // Ensure this URL matches your Django view for fetching notifications
            method: "GET",
            success: function(data) {
                // Clear existing notifications
                $('#notification-box').empty();
                // Append new notifications
                data.forEach(function(notification) {
                    $('#notification-box').append(`
                        <div class="col-sm-12">
                            <div class="alert fade alert-simple alert-warning alert-dismissible text-left font__family-montserrat font__size-16 font__weight-light brk-library-rendered rendered show" role="alert" data-id="${notification.id}">
                                <button type="button" class="close font__size-18" onclick="deleteNotification(${notification.id})">
                                    <span aria-hidden="true">
                                        <i class="fa fa-times warning"></i>
                                    </span>
                                    <span class="sr-only">Close</span>
                                </button>
                                <i class="start-icon fa fa-exclamation-triangle faa-flash animated"></i>
                                <strong class="font__weight-semibold">Notice!: </strong>
                                <div class="message">${notification.message}</div>
                                <div class="timestamp">${new Date(notification.created_at).toLocaleString()}</div>
                            </div>
                        </div>
                    `);
                });
    
                // Attach click handler to close buttons
                $('#notification-box .close').on('click', function() {
                    $(this).closest('.alert').remove();
                });
            },
            error: function(error) {
                console.log("Error fetching notifications:", error);
            }
        });
    }
    
    function deleteNotification(notificationId) {
        $.ajax({
            url: "{% url 'delete_notification' student=8 %}", // Ensure this URL matches your Django view for deleting notifications
            method: "POST",
            data: {
                'notification_id': notificationId,
                'csrfmiddlewaretoken': '{{ csrf_token }}'
            },
            success: function(response) {
                // Remove the notification from the DOM
                $(`[data-id='${notificationId}']`).remove();
            },
            error: function(error) {
                console.log("Error deleting notification:", error);
            }
        });
    }
    
    // Fetch notifications every 5 seconds
    setInterval(fetchNotifications, 60000);
    
    // Initial fetch
    $(document).ready(function() {
        fetchNotifications();
    });
    
    </script>

    <!-- Night mode JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const toggle = document.querySelector('.input');

            // Check for saved theme preference in localStorage
            if (localStorage.getItem('night-mode') === 'enabled') {
                document.body.classList.add('night-mode');
                toggle.checked = true;
            }

            toggle.addEventListener('change', function () {
                if (this.checked) {
                    document.body.classList.add('night-mode');
                    localStorage.setItem('night-mode', 'enabled');
                } else {
                    document.body.classList.remove('night-mode');
                    localStorage.setItem('night-mode', 'disabled');
                }
            });
        });
    </script>
