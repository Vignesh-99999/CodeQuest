<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Excel</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #619bd4;
        }
        .upload-btn-container {
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .upload-card {
            background: rgb(163, 219, 229);
            padding: 3rem;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 400px;
        }
        .upload-btn {
            font-size: 1.5rem;
            padding: 1rem 2rem;
            border-radius: 50px;
        }
        .upload-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: #007bff;
        }
    </style>
<link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet" />
<link href="{% static 'executor/css/styles.css' %}" rel="stylesheet" />
<script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>
<body class="sb-nav-fixed">
{% include 'headeradmin.html' %}
<div id="layoutSidenav">
    {% include 'sidebaradmin.html' %}
    <div id="layoutSidenav_content">
    <div class="upload-btn-container">
        <div class="upload-card">
            <i class="fas fa-upload upload-icon"></i>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <input type="file" name="excel_file" class="form-control mb-3">
                <button type="submit" class="btn btn-primary upload-btn">Upload Excel</button>
            </form>
        </div>
      
    </div>
    {% include 'footeradmin.html' %}
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="{% static 'executor/js/scriptsa.js' %}"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.8.0/Chart.min.js" crossorigin="anonymous"></script>
</body>
</html>
